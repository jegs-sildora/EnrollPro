<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EnrollPro Autofill</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-width: 250px;
      margin: 0;
      padding: 16px;
      background-color: #f9fafb;
    }
    h2 {
      color: #800000;
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 16px;
      text-align: center;
    }
    button {
      display: block;
      width: 100%;
      background-color: #800000;
      color: white;
      border: none;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #600000;
    }
    button:last-child {
      margin-bottom: 0;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #16a34a;
      text-align: center;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h2>EnrollPro QA</h2>
  <button id="btn-early-reg">Fill Early Registration Form</button>
  <button id="btn-scp">Fill SCP Admission Form</button>
  <button id="btn-enrollment">Fill Enrollment Form</button>
  
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
